[package]
name = "craftec-block-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Block: immutable, hash-keyed bytes. ARCHITECTURE.md §1."

# Own workspace: own lockfile, so the wasm hash (= part of every block's key) is stable.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.10.0", features = ["contract"] }
blake3 = { version = "1", default-features = false }
# Pinned by revision, not by path: the wasm must build byte-identically for
# anyone who checks this repo out. Bump the rev deliberately — it changes the
# bytes a tree-node Block is allowed to hold, hence the contract's own hash.
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "46c50ff" }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []
# The pack's work counters, for the tests and for wasm-check. Off by default,
# so none of it is in the contract's wasm.
testing = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
