[package]
name = "block-min"
version = "0.0.0"
edition = "2021"
publish = false
description = "MEASUREMENT ONLY: the smallest Block contract the node's ABI allows. Not wired, not released."

# Own workspace, as every contract here.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
