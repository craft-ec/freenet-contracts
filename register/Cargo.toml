[package]
name = "craftec-register-contract"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Register: one signed value per writer, key or k-of-n keyset. ARCHITECTURE.md §1."

# Own workspace: own lockfile, so the wasm hash (= part of every register's key) is stable.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
freenet-stdlib = { version = "0.10.0", features = ["contract"] }
blake3 = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []
# Fixtures for the tests and for wasm-check. Off by default, so none of it is in
# the contract's wasm.
testing = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
