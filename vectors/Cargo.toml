[package]
name = "vectors"
version = "0.0.0"
edition = "2021"
publish = false
description = "Writes the frozen accept/refuse corpus the wasm-opt differential replays."

[dependencies]
# No default features: the wasm entry points are not wanted here, only the
# plain functions and the test helpers that build states the contracts accept.
craftec-block-contract = { path = "../block", default-features = false, features = ["testing"] }
craftec-webapp-contract = { path = "../webapp", default-features = false, features = ["testing"] }
craftec-register-contract = { path = "../register", default-features = false, features = ["testing"] }
craftec-bag-contract = { path = "../bag", default-features = false, features = ["testing"] }
craftec-set-contract = { path = "../set", default-features = false, features = ["testing"] }
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "9764b86" }
blake3 = "1"

[workspace]
