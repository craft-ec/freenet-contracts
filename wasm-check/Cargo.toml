[package]
name = "wasm-check"
version = "0.0.0"
edition = "2021"
publish = false
description = "Times the block contract's validation inside wasm32, where it runs."

[lib]
crate-type = ["cdylib"]

[dependencies]
# No default features: the contract's wasm entry points are not wanted here,
# only the plain function they call.
craftec-block-contract = { path = "../block", default-features = false }
craftec-register-contract = { path = "../register", default-features = false, features = ["testing"] }
craftec-bag-contract = { path = "../bag", default-features = false, features = ["testing"] }
craftec-set-contract = { path = "../set", default-features = false, features = ["testing"] }
freenet-prolly = { git = "https://github.com/craft-ec/freenet-prolly", rev = "17d67d8" }

# The contracts' profile, field for field. check-wasm.sh times this crate
# with the flags a contract ships with precisely so the number is about the
# code that ships; a profile that differs in a field which changes codegen
# would make it a number about something else. `debug` was the one that
# differed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[workspace]
